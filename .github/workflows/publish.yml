name: Publish latest

# Every merge to main replaces the rolling `latest` pre-release, so the newest
# main build has a stable download URL:
#
#   https://github.com/${{ github.repository }}/releases/download/latest/ClaudeUsageBar.dmg
#
# Versioned releases and the Sparkle appcast still come from release.yml on a
# v* tag — nothing here touches them.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-latest
  cancel-in-progress: true

jobs:
  publish:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        # The pull request already ran these, but a direct push to main did
        # not — and a broken build must not become the published download.
        run: cd macos && swift test

      - name: Build and verify DMG
        run: make dmg

      - name: Replace the latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deleted rather than edited: an existing tag pins the release to the
          # commit it was cut from, so `latest` would keep pointing at an old
          # build even after the asset was replaced.
          gh release delete latest --cleanup-tag --yes || true

          # printf rather than a heredoc: a heredoc inside this YAML block
          # would carry the block's indentation into the release notes.
          printf '%s\n' \
            "Built from main at ${GITHUB_SHA::7} — $(git log -1 --pretty=%s)" \
            "" \
            "Replaced by every merge to main, and never offered to Sparkle. Versioned releases come from v* tags." \
            > notes.md

          gh release create latest macos/ClaudeUsageBar.dmg \
            --title "Latest build from main" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes-file notes.md
