name: Build

on:
  # Every branch, so a DMG is downloadable from the run without opening a PR
  # or cutting a tag. Releases still come from release.yml on a v* tag.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A push and its pull request share a group, so opening a PR does not build
# the same commit twice.
concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: cd macos && swift build -c release

      - name: Run tests
        run: cd macos && swift test

      - name: Build app archives
        run: make release-artifacts

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageBar.zip
          path: macos/ClaudeUsageBar.zip

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageBar.dmg
          path: macos/ClaudeUsageBar.dmg
